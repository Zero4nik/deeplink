<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
</head>
<body>
  <h1>WebSocket Test</h1>
  <div id="output"></div>
  <script>
    console.log('1. Скрипт запущен');
    

    const socket = io('http://localhost:3001');
    console.log('2. Socket создан');
    

    const userId = 'cmohc01vw0001e8qd1w2cbmer';
    
    socket.on('connect', () => {
      console.log('3. Подключено к серверу!');
      socket.emit('join', userId);
      console.log('4. Отправлен join для:', userId);
    });
    
    socket.on('notification', (data) => {
      console.log('5. Уведомление получено:', data);
      document.getElementById('output').innerHTML += `<div>🔔 ${JSON.stringify(data)}</div>`;
    });
    
    socket.on('connect_error', (err) => {
      console.error('Ошибка подключения:', err);
    });
  </script>
</body>
</html>
