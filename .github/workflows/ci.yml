name: CI - Tests

on:
  push:
    branches: [main,develop]
  pull_reques:
    branches: [main]

env:
  NODE_VERSION: '20'
  DATABASE_URL : postgresql://postgres:postgres@localhost:5432/deeplink
  REDIS_URL : redis://localhost:6379
  JWT_SECRET : suP3rS3cr3tK3yForJWT2026

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: deeplink_test
        ports:
          - 5432:5432
        options: >-
        --health-cmd pg_isready
        --health-interval 10s
        --health_timeout 5s
        --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
        --health-cmd "redis-cli ping"
        --health-interval 10s
        --health_timeout 5s
        --health-retries 5

      steps:
        -name: Checkout code
        uses:  actions/checkout@v4

        -name: Setup Node.js
        uses:  actions/checkout@v4
        with:
          node-version: $({env.NODE_VERSION})
          catche: 'npm'

                - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}